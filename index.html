<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DailyInfo - 财联社 7×24 实时快讯</title>
  <meta name="description" content="全天候 7×24 小时财经电报与市场快讯，实时掌控 A 股与全球金融资讯。">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body>

  <!-- 手机尺寸核心容器 (PC 端自适应居中精致框架，移动端满屏原生体验) -->
  <div class="app-container">
    
    <!-- 顶部固定导航区 -->
    <header class="header-wrapper">
      <div class="top-bar">
        <!-- 品牌与标题 -->
        <div class="brand-area">
          <div class="brand-icon">⚡</div>
          <div class="brand-title-wrap">
            <div class="brand-name">
              <span>DailyInfo</span>
              <span class="live-indicator">
                <span class="pulse-dot"></span> 实时
              </span>
            </div>
            <div class="brand-sub">7×24 财经电报与市场要闻</div>
          </div>
        </div>

        <!-- 顶部操作区 -->
        <div class="top-actions">
          <!-- 快捷搜索 -->
          <button class="action-btn" id="searchToggleBtn" title="搜索快讯" aria-label="搜索">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>

          <!-- 字号调节 -->
          <button class="action-btn" id="fontSizeBtn" title="切换大字号" aria-label="字号">
            <span style="font-size: 13px; font-weight: 800;">A<span style="font-size: 10px;">+</span></span>
          </button>

          <!-- 手动刷新 -->
          <button class="action-btn" id="refreshBtn" title="刷新最新电报" aria-label="刷新">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- 搜索展开抽屉 -->
      <div class="search-drawer" id="searchDrawer">
        <div class="search-input-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="search-input" placeholder="搜索快讯关键词（如：ETF、降息、茅台）...">
          <button type="button" class="search-clear-btn" id="searchClearBtn" aria-label="清空">✕</button>
        </div>
        <!-- 常用快捷筛选标签 -->
        <div class="quick-filter-tags">
          <span class="filter-tag" data-kw="ETF"># ETF</span>
          <span class="filter-tag" data-kw="收评"># 收评</span>
          <span class="filter-tag" data-kw="央行"># 央行/降准</span>
          <span class="filter-tag" data-kw="芯片"># 芯片/半导体</span>
          <span class="filter-tag" data-kw="白酒"># 白酒/消费</span>
          <span class="filter-tag" data-kw="重磅"># 焦点重磅</span>
        </div>
      </div>

      <!-- Tab 导航栏 (预留扩展更多 Tab) -->
      <div class="tabs-scroll-container" id="tabsContainer">
        <!-- 由 js 动态渲染，支持直接在 CONFIG.tabs 中配置新增 -->
      </div>
    </header>

    <!-- 状态小标栏 -->
    <div class="status-bar">
      <div class="status-time" id="statusTime">
        <span>⚡</span> <span>正在同步电报网络...</span>
      </div>
      <div class="status-count" id="statusCount">共 0 条</div>
    </div>

    <!-- 资讯信息流内容区 (与截图排版一致) -->
    <main class="news-feed-container" id="newsFeed">
      <div class="loading-box">
        <div class="spinner"></div>
        <div>正在连接 7×24 财经电报网络...</div>
      </div>
    </main>

    <!-- 浮动回到顶部按钮 -->
    <button class="back-to-top" id="backToTopBtn" title="返回顶部" aria-label="返回顶部">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>

    <!-- 轻提示 Toast -->
    <div class="toast-msg" id="toast">已更新</div>

    <!-- 底部版权与免责声明 -->
    <footer class="app-footer">
      <div>DailyInfo · 财联社 7×24 实时快讯聚合</div>
      <div>数据来源网络公开发布电报，仅供学习交流，不构成任何投资建议</div>
    </footer>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
