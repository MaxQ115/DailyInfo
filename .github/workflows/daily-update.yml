name: Daily Data Update

on:
  schedule:
    # 北京时间每天 09:20（新浪酒价内参每天约 09:00 更新）
    - cron: '20 1 * * *'
    # 北京时间每天 19:30（TLDR AI 美东早刊发布后）
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily update script
        run: python3 scripts/update_daily.py

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain js/ index.html)" ]; then
            git add js/liquor-data.js js/tldr-data.js index.html
            git commit -m "chore(data): 自动更新酒价内参与 TLDR AI 最新数据"
            git push
          else
            echo "No data changes to commit."
          fi

